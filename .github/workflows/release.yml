name: Release

# Cut a release by pushing a tag matching `v<version>`, e.g.:
#   npm version patch --workspace @taking-book/desktop
#   git push origin main --follow-tags
# The tag version must match packages/desktop/package.json.

on:
  push:
    tags:
      - 'v*'
  # Manual trigger to verify Windows, Linux and macOS builds without cutting a tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # windows-latest is a VS2026-only image (windows-2025-vs2026) that
        # node-gyp cannot detect ("unknown version undefined"), so any native
        # module source build (better-sqlite3 via npm ci, electron-rebuild
        # via forge make) fails. Pin windows-2022, which ships VS2022.
        # macos-latest is Apple Silicon (arm64): the .zip it makes runs on
        # M-series Macs only. The app is unsigned and not notarized, so users
        # open it once via right-click -> Open.
        os: [ubuntu-latest, windows-2022, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # Bake the publisher's Google OAuth client into resources/. When the
      # secrets are missing the build still proceeds; sync is disabled at
      # runtime until they are set and a new release is cut.
      - name: Write OAuth env
        shell: bash
        run: |
          echo "TB_GDRIVE_CLIENT_ID=${{ secrets.TB_GDRIVE_CLIENT_ID }}" >> packages/desktop/.env
          echo "TB_GDRIVE_CLIENT_SECRET=${{ secrets.TB_GDRIVE_CLIENT_SECRET }}" >> packages/desktop/.env

      - run: npm ci

      - name: Make distributable
        working-directory: packages/desktop
        run: npm run make

      - name: Upload make output
        uses: actions/upload-artifact@v6
        with:
          name: make-${{ matrix.os }}
          path: packages/desktop/out/make/
          if-no-files-found: error

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      # Signing inputs for packages/mobile/android/app/build.gradle (ADR-0011).
      TB_KEYSTORE_PASSWORD: ${{ secrets.TB_ANDROID_KEYSTORE_PASSWORD }}
      TB_KEY_ALIAS: ${{ secrets.TB_ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # A tag push uses the tag as the version. A manual run has no tag, so it
      # takes the desktop version, which the tag must match anyway.
      - name: Derive version
        id: version
        run: |
          desktop_version=$(node -p "require('./packages/desktop/package.json').version")
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            if [ "$tag" != "v${desktop_version}" ]; then
              echo "Tag $tag does not match packages/desktop/package.json version ${desktop_version}." >&2
              exit 1
            fi
          else
            tag="v${desktop_version}"
          fi
          node packages/mobile/scripts/derive-android-version.mjs "$tag"

      - run: npm ci

      # The device-flow OAuth client (ADR-0010) is baked into the web bundle;
      # when the secrets are missing the build proceeds with Drive sync off.
      - name: Build web assets and sync Capacitor
        working-directory: packages/mobile
        env:
          VITE_TB_GDRIVE_CLIENT_ID: ${{ secrets.TB_GDRIVE_CLIENT_ID }}
          VITE_TB_GDRIVE_CLIENT_SECRET: ${{ secrets.TB_GDRIVE_CLIENT_SECRET }}
        run: npm run android:sync

      # The keystore is decoded to a runner temp file only for the Gradle run
      # and removed in the always() step below. When the secrets are absent, a
      # manual run still builds an unsigned APK; a tag push refuses to publish
      # one.
      - name: Decode keystore
        id: keystore
        env:
          TB_ANDROID_KEYSTORE_BASE64: ${{ secrets.TB_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$TB_ANDROID_KEYSTORE_BASE64" ] || [ -z "$TB_KEYSTORE_PASSWORD" ] || [ -z "$TB_KEY_ALIAS" ]; then
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              echo "Android signing secrets are missing; refusing to publish an unsigned APK." >&2
              exit 1
            fi
            echo "Signing secrets missing; building an unsigned APK (manual run only)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keystore_path="${RUNNER_TEMP}/release.p12"
          echo "$TB_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          echo "TB_KEYSTORE_PATH=${keystore_path}" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        working-directory: packages/mobile/android
        run: >
          ./gradlew assembleRelease
          -PversionName=${{ steps.version.outputs.versionName }}
          -PversionCode=${{ steps.version.outputs.versionCode }}

      - name: Delete keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/release.p12"

      - name: Name and verify APK
        id: apk
        env:
          SIGNED: ${{ steps.keystore.outputs.signed }}
          VERSION_NAME: ${{ steps.version.outputs.versionName }}
        run: |
          output_dir=packages/mobile/android/app/build/outputs/apk/release
          mkdir -p dist
          if [ "$SIGNED" = "true" ]; then
            apk="dist/taking-book-${VERSION_NAME}.apk"
            cp "${output_dir}/app-release.apk" "$apk"
            apksigner=$(ls "${ANDROID_HOME}"/build-tools/*/apksigner | sort -V | tail -n 1)
            # Prints the signing certificate so it can be compared with the
            # SHA-256 registered in the Android Developer Console (ADR-0011).
            "$apksigner" verify --print-certs "$apk"
          else
            apk="dist/taking-book-${VERSION_NAME}-unsigned.apk"
            cp "${output_dir}/app-release-unsigned.apk" "$apk"
          fi
          echo "path=$apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: android-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

  release:
    name: Create release
    needs: [build, android]
    # Manual dispatch runs verify the builds only; publishing stays tag-gated.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so the notes can list commits since the previous tag.
          fetch-depth: 0

      - uses: actions/download-artifact@v6
        with:
          path: artifacts
          merge-multiple: true

      # Work lands as direct commits rather than PRs, so GitHub's generated
      # notes come out empty; list the commit subjects since the last tag.
      - name: Write release notes
        run: |
          previous_tag=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          range=${previous_tag:+${previous_tag}..}${GITHUB_REF_NAME}
          {
            echo "## What's changed"
            echo
            git log "$range" --no-merges --pretty='- %s'
            echo
            echo "**Installing on Android**: see the [install guide](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/README.md#install-on-android) (unknown sources, Play Protect, developer verification)."
            if [ -n "$previous_tag" ]; then
              echo
              echo "**Full changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${previous_tag}...${GITHUB_REF_NAME}"
            fi
          } > release-notes.md
          # Fail the run rather than publish a release without a change list.
          if [ "$(git log "$range" --no-merges --pretty='%s' | wc -l)" -eq 0 ]; then
            echo "No commits found for $range; refusing to publish empty notes." >&2
            exit 1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: artifacts/**/*.{exe,nupkg,blockmap,deb,zip,apk}
          fail_on_unmatched_files: false
