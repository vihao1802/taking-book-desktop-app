name: Release

# Cut a release by pushing a tag matching `v<version>`, e.g.:
#   npm version patch --workspace @taking-book/desktop
#   git push origin main --follow-tags
# The tag version must match packages/desktop/package.json.

on:
  push:
    tags:
      - 'v*'
  # Manual trigger to verify Windows, Linux and macOS builds without cutting a tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # windows-latest is a VS2026-only image (windows-2025-vs2026) that
        # node-gyp cannot detect ("unknown version undefined"), so any native
        # module source build (better-sqlite3 via npm ci, electron-rebuild
        # via forge make) fails. Pin windows-2022, which ships VS2022.
        # macos-latest is Apple Silicon (arm64): the .zip it makes runs on
        # M-series Macs only. The app is unsigned and not notarized, so users
        # open it once via right-click -> Open.
        os: [ubuntu-latest, windows-2022, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # Bake the publisher's Google OAuth client into resources/. When the
      # secrets are missing the build still proceeds; sync is disabled at
      # runtime until they are set and a new release is cut.
      - name: Write OAuth env
        shell: bash
        run: |
          echo "TB_GDRIVE_CLIENT_ID=${{ secrets.TB_GDRIVE_CLIENT_ID }}" >> packages/desktop/.env
          echo "TB_GDRIVE_CLIENT_SECRET=${{ secrets.TB_GDRIVE_CLIENT_SECRET }}" >> packages/desktop/.env

      - run: npm ci

      - name: Make distributable
        working-directory: packages/desktop
        run: npm run make

      - name: Upload make output
        uses: actions/upload-artifact@v6
        with:
          name: make-${{ matrix.os }}
          path: packages/desktop/out/make/
          if-no-files-found: error

  release:
    name: Create release
    needs: build
    # Manual dispatch runs verify the builds only; publishing stays tag-gated.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so the notes can list commits since the previous tag.
          fetch-depth: 0

      - uses: actions/download-artifact@v6
        with:
          path: artifacts
          merge-multiple: true

      # Work lands as direct commits rather than PRs, so GitHub's generated
      # notes come out empty; list the commit subjects since the last tag.
      - name: Write release notes
        run: |
          previous_tag=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          range=${previous_tag:+${previous_tag}..}${GITHUB_REF_NAME}
          {
            echo "## What's changed"
            echo
            git log "$range" --no-merges --pretty='- %s'
            if [ -n "$previous_tag" ]; then
              echo
              echo "**Full changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${previous_tag}...${GITHUB_REF_NAME}"
            fi
          } > release-notes.md
          # Fail the run rather than publish a release without a change list.
          if [ "$(git log "$range" --no-merges --pretty='%s' | wc -l)" -eq 0 ]; then
            echo "No commits found for $range; refusing to publish empty notes." >&2
            exit 1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: artifacts/**/*.{exe,nupkg,blockmap,deb,zip}
          fail_on_unmatched_files: false
