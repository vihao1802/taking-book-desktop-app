name: Release

# Cut a release by pushing a tag matching `v<version>`, e.g.:
#   npm version patch --workspace @taking-book/desktop
#   git push origin main --follow-tags
# The tag version must match packages/desktop/package.json.

on:
  push:
    tags:
      - 'v*'
  # Manual trigger to verify Windows + Linux builds without cutting a tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # Bake the publisher's Google OAuth client into resources/. When the
      # secrets are missing the build still proceeds; sync is disabled at
      # runtime until they are set and a new release is cut.
      - name: Write OAuth env
        shell: bash
        run: |
          echo "TB_GDRIVE_CLIENT_ID=${{ secrets.TB_GDRIVE_CLIENT_ID }}" >> packages/desktop/.env
          echo "TB_GDRIVE_CLIENT_SECRET=${{ secrets.TB_GDRIVE_CLIENT_SECRET }}" >> packages/desktop/.env

      - run: npm ci

      - name: Make distributable
        working-directory: packages/desktop
        run: npm run make

      - name: Upload make output
        uses: actions/upload-artifact@v6
        with:
          name: make-${{ matrix.os }}
          path: packages/desktop/out/make/
          if-no-files-found: error

  release:
    name: Create release
    needs: build
    # Manual dispatch runs verify the builds only; publishing stays tag-gated.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*.{exe,nupkg,blockmap,deb}
          fail_on_unmatched_files: false